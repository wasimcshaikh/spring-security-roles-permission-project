databaseChangeLog:

  - changeSet:
      id: 003-create-provider-document
      author: medislot

      changes:

        - createTable:
            tableName: provider_document

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: provider_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: file_data
                  type: BYTEA
                  constraints:
                    nullable: false

              - column:
                  name: content_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: file_size
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: uploaded_at
                  type: TIMESTAMP
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: provider_document
            baseColumnNames: provider_id
            referencedTableName: provider
            referencedColumnNames: id
            constraintName: fk_provider_document_provider