databaseChangeLog:

  - changeSet:
      id: 021-add-video-call-permission
      author: medislot

      changes:

        - insert:
            tableName: permission
            columns:
              - column:
                  name: name
                  value: VIDEO_CALL

      rollback:

        - delete:
            tableName: permission
            where: name = 'VIDEO_CALL'