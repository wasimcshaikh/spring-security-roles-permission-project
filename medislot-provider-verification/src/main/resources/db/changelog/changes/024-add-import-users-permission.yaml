databaseChangeLog:

  - changeSet:
      id: 024-add-import-users-permission
      author: medislot

      changes:

        - insert:
            tableName: permission
            columns:
              - column:
                  name: name
                  value: IMPORT_USERS

      rollback:

        - delete:
            tableName: permission
            where: name = 'IMPORT_USERS'