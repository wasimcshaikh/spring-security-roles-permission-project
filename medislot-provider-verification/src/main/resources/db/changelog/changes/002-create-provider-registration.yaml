databaseChangeLog:

  - changeSet:
      id: 002-create-provider-registration
      author: medislot

      changes:

        - createTable:
            tableName: provider_registration

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: full_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: phone_number
                  type: VARCHAR(20)

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: otp
                  type: VARCHAR(6)
                  constraints:
                    nullable: false

              - column:
                  name: otp_expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: otp_attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false