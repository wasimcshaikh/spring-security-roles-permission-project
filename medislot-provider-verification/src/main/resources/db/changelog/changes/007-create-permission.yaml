databaseChangeLog:

  - changeSet:
      id: 007-create-permission
      author: medislot

      changes:

        - createTable:
            tableName: permission

            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

      rollback:

        - dropTable:
            tableName: permission