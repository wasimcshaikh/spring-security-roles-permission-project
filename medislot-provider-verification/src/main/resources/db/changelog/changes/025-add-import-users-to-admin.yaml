databaseChangeLog:

  - changeSet:
      id: 025-add-import-users-to-admin
      author: medislot

      changes:

        - sql:
            sql: >
              INSERT INTO role_permission (role_id, permission_id)
              SELECT r.id, p.id
              FROM role r
              CROSS JOIN permission p
              WHERE r.name = 'ADMIN'
                AND p.name = 'IMPORT_USERS';

      rollback:

        - sql:
            sql: >
              DELETE FROM role_permission
              WHERE role_id = (
                  SELECT id
                  FROM role
                  WHERE name = 'ADMIN'
              )
              AND permission_id = (
                  SELECT id
                  FROM permission
                  WHERE name = 'IMPORT_USERS'
              );