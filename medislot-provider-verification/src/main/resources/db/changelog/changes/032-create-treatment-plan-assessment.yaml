
databaseChangeLog:

  - changeSet:
      id: 032-create-treatment-plan-assessment
      author: medislot

      changes:

        - createTable:
            tableName: treatment_plan_assessment
            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: assessment_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: frequency
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: frequency_unit
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: treatment_plan_assessment
            baseColumnNames: customer_id
            constraintName: fk_treatment_plan_assessment_customer
            referencedTableName: customer
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: treatment_plan_assessment
            baseColumnNames: assessment_id
            constraintName: fk_treatment_plan_assessment_assessment
            referencedTableName: assessment
            referencedColumnNames: id

        - sql:
            sql: >
              ALTER TABLE treatment_plan_assessment
              ADD CONSTRAINT chk_treatment_plan_assessment_frequency
              CHECK (frequency > 0);

        - sql:
            sql: >
              ALTER TABLE treatment_plan_assessment
              ADD CONSTRAINT chk_treatment_plan_assessment_frequency_unit
              CHECK (frequency_unit IN ('DAY', 'WEEK', 'MONTH'));

      rollback:

        - dropTable:
            tableName: treatment_plan_assessment
